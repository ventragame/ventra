name: Ventra Kids Slice QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kids-slice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-android-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Advisory dependency audit (do not silently auto-upgrade)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Dependency vulnerability report (non-destructive)
        run: |
          npm audit --json > dependency-audit.json || true
          node -e "const a=require('./dependency-audit.json');console.log('npm audit severity totals:',JSON.stringify(a.metadata?.vulnerabilities ?? {}));"
      - name: Save audit report for review
        uses: actions/upload-artifact@v4
        with:
          name: npm-dependency-audit
          path: dependency-audit.json
          retention-days: 14
      - name: Check TypeScript
        run: npm run type-check
      - name: Test learning, isolation, progress and RLS
        run: npm --workspace=apps/web run test:ci
      - name: Build production web bundle (no deployment)
        run: npm run build:web
      - name: Verify packaged offline English model and WASM (web)
        run: npm --workspace=apps/web run speech:verify
      - name: Build static mobile web bundle (no deployment)
        run: npm --workspace=apps/web run export
      - name: Verify packaged offline English model and WASM (mobile)
        run: npm --workspace=apps/web run speech:verify:export
      - name: Sync Android Capacitor assets (no APK or deployment)
        run: npm --workspace=apps/mobile run sync:android
      - name: Set up Java 17 for native Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK (compile SDK 36)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Warm Gradle distribution with retries (transient download failures)
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --version; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle distribution download failed after three attempts" >&2
              exit 1
            fi
            echo "Gradle distribution unavailable; retrying attempt $((attempt + 1)) / 3"
            sleep $((attempt * 12))
          done
      - name: Assemble Android debug APK (no publishing)
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload Android debug APK for physical phone testing
        uses: actions/upload-artifact@v4
        with:
          name: ventra-android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Validate unsigned Android release bundle (no publishing)
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon bundleRelease

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build static mobile web bundle
        run: npm --workspace=apps/web run export
      - name: Verify packaged offline English model and WASM (iOS)
        run: npm --workspace=apps/web run speech:verify:export
      - name: Sync iOS Capacitor assets and CocoaPods
        run: npm --workspace=apps/mobile run sync:ios
      - name: Compile iOS Simulator app (no signing or App Store publishing)
        run: |
          xcodebuild \
            -workspace apps/mobile/ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
