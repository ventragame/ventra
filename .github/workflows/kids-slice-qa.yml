name: Ventra Kids Slice QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kids-slice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-android-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run type-check
      - name: Test learning, isolation, progress and RLS
        run: npm --workspace=apps/web run test:ci
      - name: Build production web bundle (no deployment)
        run: npm run build:web
      - name: Build static mobile web bundle (no deployment)
        run: npm --workspace=apps/web run export
      - name: Sync Android Capacitor assets (no APK or deployment)
        run: npm --workspace=apps/mobile run sync:android
      - name: Set up Java 17 for native Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK (compile SDK 36)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble unsigned Android debug APK (no publishing)
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build static mobile web bundle
        run: npm --workspace=apps/web run export
      - name: Sync iOS Capacitor assets and CocoaPods
        run: npm --workspace=apps/mobile run sync:ios
      - name: Compile iOS Simulator app (no signing or App Store publishing)
        run: |
          xcodebuild \
            -workspace apps/mobile/ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
