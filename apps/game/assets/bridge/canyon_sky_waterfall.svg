<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#7dd3fc"/>
      <stop offset="65%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#fef08a" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#fde047" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Distant Mountains -->
    <linearGradient id="distMountGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Floating Island 1 (Left Distant) -->
    <linearGradient id="islandFarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Floating Island 2 (Center Midground with Waterfall) -->
    <linearGradient id="islandMidRock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="islandMidGrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Waterfall Gradient -->
    <linearGradient id="waterfallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="20%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Cloud Mist Gradient -->
    <linearGradient id="mistGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#f0f9ff" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#e0f2fe" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Vignette / Depth -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <!-- 1. Sky Base -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>

  <!-- 2. Warm Sun Rays & Glow -->
  <circle cx="960" cy="180" r="600" fill="url(#sunGlow)"/>

  <!-- Sun Beams -->
  <polygon points="960,180 300,1080 460,1080" fill="#ffffff" opacity="0.08"/>
  <polygon points="960,180 750,1080 920,1080" fill="#ffffff" opacity="0.09"/>
  <polygon points="960,180 1150,1080 1320,1080" fill="#ffffff" opacity="0.09"/>
  <polygon points="960,180 1550,1080 1720,1080" fill="#ffffff" opacity="0.07"/>

  <!-- 3. Soft Far Distant Mountain Silhouettes -->
  <path d="M 0,650 Q 250,540 500,620 Q 800,500 1100,590 Q 1400,480 1700,560 L 1920,620 L 1920,1080 L 0,1080 Z" fill="url(#distMountGrad)"/>

  <!-- 4. Distant Floating Island Left -->
  <g transform="translate(180, 260) scale(0.65)">
    <!-- Island Rock Base -->
    <path d="M 100,200 L 420,200 Q 430,220 400,280 L 320,440 Q 280,500 250,510 L 230,510 Q 180,480 130,380 L 90,260 Q 80,210 100,200 Z" fill="url(#islandFarGrad)" opacity="0.75"/>
    <!-- Grass Top -->
    <ellipse cx="260" cy="200" rx="170" ry="35" fill="#3b82f6" opacity="0.85"/>
    <!-- Ancient Temple Silhouette -->
    <rect x="220" y="140" width="80" height="60" rx="6" fill="#1e3a8a" opacity="0.7"/>
    <polygon points="210,140 260,100 310,140" fill="#1e3a8a" opacity="0.75"/>
  </g>

  <!-- 5. Distant Floating Island Right -->
  <g transform="translate(1380, 220) scale(0.7)">
    <!-- Island Rock Base -->
    <path d="M 80,180 L 400,180 Q 410,210 370,300 L 290,460 Q 250,520 230,530 L 210,530 Q 160,490 120,400 L 70,250 Q 60,190 80,180 Z" fill="url(#islandFarGrad)" opacity="0.7"/>
    <!-- Grass Top -->
    <ellipse cx="240" cy="180" rx="165" ry="32" fill="#3b82f6" opacity="0.8"/>
  </g>

  <!-- 6. Midground Majestic Floating Island with Waterfalls (Center-Back) -->
  <g transform="translate(680, 280) scale(0.95)">
    <!-- Island Rock Keystone -->
    <path d="M 50,180 L 550,180 Q 570,210 520,320 L 420,520 Q 350,660 300,680 L 280,680 Q 220,640 160,510 L 70,320 Q 40,200 50,180 Z" 
          fill="url(#islandMidRock)" stroke="#64748b" stroke-width="2"/>
    
    <!-- Rock Facets -->
    <path d="M 140,240 L 230,360 L 190,470 L 110,380 Z" fill="#1e293b" opacity="0.7"/>
    <path d="M 380,260 L 460,370 L 420,490 L 330,410 Z" fill="#0f172a" opacity="0.65"/>
    <path d="M 240,280 L 340,300 L 310,480 L 220,440 Z" fill="#334155" opacity="0.5"/>

    <!-- Lush Grass Surface -->
    <path d="M 40,180 Q 150,150 300,155 Q 450,150 560,180 Q 580,205 540,225 Q 460,240 300,235 Q 140,240 60,225 Q 30,205 40,180 Z" 
          fill="url(#islandMidGrass)" stroke="#bbf7d0" stroke-width="3"/>

    <!-- Small Temple / Crystal on Island -->
    <polygon points="300,70 325,145 275,145" fill="#38bdf8" stroke="#ffffff" stroke-width="2" opacity="0.95"/>
    <ellipse cx="300" cy="148" rx="40" ry="10" fill="#0284c7" opacity="0.8"/>

    <!-- Waterfall 1 (Left stream pouring down) -->
    <path d="M 180,230 Q 185,380 180,560 Q 175,700 178,820 L 198,820 Q 200,700 202,560 Q 205,380 200,230 Z" 
          fill="url(#waterfallGrad)"/>
    <ellipse cx="188" cy="820" rx="35" ry="12" fill="#ffffff" opacity="0.6"/>

    <!-- Waterfall 2 (Right smaller cascade) -->
    <path d="M 390,235 Q 395,360 392,520 Q 388,650 390,750 L 406,750 Q 408,650 410,520 Q 412,360 408,235 Z" 
          fill="url(#waterfallGrad)"/>
    <ellipse cx="398" cy="750" rx="28" ry="9" fill="#ffffff" opacity="0.5"/>

    <!-- Waterfall Spray & Mist -->
    <circle cx="188" cy="800" r="45" fill="#ffffff" opacity="0.25" filter="blur(8px)"/>
    <circle cx="398" cy="740" r="35" fill="#ffffff" opacity="0.2" filter="blur(6px)"/>
  </g>

  <!-- 7. Fluffy Clouds around Mountain Tops -->
  <!-- Cloud 1 Left -->
  <path d="M 80,680 Q 140,620 220,640 Q 300,600 380,650 Q 440,620 500,670 L 520,740 L 60,740 Z" fill="#ffffff" opacity="0.55"/>
  <!-- Cloud 2 Center -->
  <path d="M 720,720 Q 800,650 920,670 Q 1020,620 1140,680 Q 1240,650 1320,720 L 1340,820 L 680,820 Z" fill="#ffffff" opacity="0.6"/>
  <!-- Cloud 3 Right -->
  <path d="M 1480,640 Q 1560,580 1660,610 Q 1760,570 1860,630 L 1920,670 L 1920,740 L 1440,740 Z" fill="#ffffff" opacity="0.5"/>

  <!-- 8. Soft Bottom Mist (Kanyon Derinlik Sisi) -->
  <rect y="760" width="1920" height="320" fill="url(#mistGrad)"/>

  <!-- 9. Floating Magical Motes / Shimmer Particles -->
  <circle cx="450" cy="380" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="480" cy="350" r="6" fill="#fef08a" opacity="0.7"/>
  <circle cx="820" cy="240" r="5" fill="#bae6fd" opacity="0.9"/>
  <circle cx="860" cy="290" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="1120" cy="260" r="6" fill="#fef08a" opacity="0.85"/>
  <circle cx="1180" cy="220" r="4" fill="#ffffff" opacity="0.75"/>
  <circle cx="1450" cy="340" r="5" fill="#67e8f9" opacity="0.8"/>
  <circle cx="1520" cy="390" r="7" fill="#fef08a" opacity="0.7"/>

  <!-- 10. Subtle Vignette Border -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>

