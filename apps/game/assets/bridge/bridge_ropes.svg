<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs>
    <linearGradient id="ropeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="ropeShadow" x="-5%" y="-10%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Top Handrail Cable (Catenary curve) -->
  <path d="M 10,25 Q 300,85 590,25" stroke="url(#ropeGrad)" stroke-width="9" fill="none" 
        stroke-linecap="round" filter="url(#ropeShadow)"/>
  <path d="M 10,25 Q 300,85 590,25" stroke="#78350f" stroke-width="2" stroke-dasharray="6,4" fill="none"/>

  <!-- Bottom Footwalk Cable (Catenary curve) -->
  <path d="M 15,100 Q 300,135 585,100" stroke="url(#ropeGrad)" stroke-width="11" fill="none" 
        stroke-linecap="round" filter="url(#ropeShadow)"/>
  <path d="M 15,100 Q 300,135 585,100" stroke="#78350f" stroke-width="2.5" stroke-dasharray="8,5" fill="none"/>

  <!-- Vertical Dropper Ropes -->
  <line x1="80" y1="36" x2="80" y2="108" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
  <line x1="160" y1="52" x2="160" y2="118" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
  <line x1="240" y1="65" x2="240" y2="126" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
  <line x1="320" y1="68" x2="320" y2="128" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
  <line x1="400" y1="64" x2="400" y2="125" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
  <line x1="480" y1="50" x2="480" y2="116" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
  <line x1="540" y1="34" x2="540" y2="106" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
</svg>