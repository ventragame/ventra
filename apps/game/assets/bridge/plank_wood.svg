<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="360" height="90">
  <defs>
    <linearGradient id="plankGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="35%" stop-color="#b45309"/>
      <stop offset="85%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="topBevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="plankGlow" x="-5%" y="-15%" width="110%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0c0a09" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Main Wooden Board -->
  <rect x="6" y="8" width="348" height="74" rx="12" fill="url(#plankGrad)" filter="url(#plankGlow)" stroke="#451a03" stroke-width="3"/>

  <!-- Top Highlight Bevel -->
  <rect x="10" y="10" width="340" height="18" rx="8" fill="url(#topBevel)"/>

  <!-- Wood Grain Lines -->
  <path d="M 25,28 Q 120,24 230,30 Q 300,26 335,28" stroke="#78350f" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M 40,48 Q 140,54 260,46 Q 310,50 330,48" stroke="#451a03" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 30,64 Q 100,60 190,66 Q 280,62 335,64" stroke="#78350f" stroke-width="2" fill="none" opacity="0.55" stroke-linecap="round"/>
  
  <!-- Subtle Wood Knot -->
  <ellipse cx="160" cy="42" rx="12" ry="5" fill="#78350f" opacity="0.45"/>
  <ellipse cx="160" cy="42" rx="6" ry="2" fill="#451a03" opacity="0.6"/>

  <!-- Iron Rivets / Nails on Corners -->
  <circle cx="22" cy="22" r="5" fill="#fef08a" stroke="#713f12" stroke-width="2"/>
  <circle cx="22" cy="68" r="5" fill="#fef08a" stroke="#713f12" stroke-width="2"/>
  <circle cx="338" cy="22" r="5" fill="#fef08a" stroke="#713f12" stroke-width="2"/>
  <circle cx="338" cy="68" r="5" fill="#fef08a" stroke="#713f12" stroke-width="2"/>
</svg>