<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200" width="180" height="200">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#091b2c"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <radialGradient id="thrusterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <filter id="robotShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Anti-Gravity Hover Thruster Glow -->
  <ellipse cx="90" cy="180" rx="35" ry="12" fill="url(#thrusterGlow)"/>

  <!-- Antenna -->
  <line x1="90" y1="42" x2="90" y2="16" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="90" cy="14" r="10" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <circle cx="87" cy="11" r="3" fill="#fef08a"/>

  <!-- Robot Head / Body (Single sleek rounded unit) -->
  <rect x="35" y="40" width="110" height="110" rx="42" fill="url(#bodyGrad)" filter="url(#robotShadow)" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Left / Right Ear Thrusters -->
  <rect x="22" y="76" width="16" height="34" rx="6" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
  <rect x="142" y="76" width="16" height="34" rx="6" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>

  <!-- Dark Visor Screen -->
  <rect x="48" y="60" width="84" height="60" rx="20" fill="url(#screenGrad)" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Happy Digital Eyes (^ ^) -->
  <path d="M 64,95 Q 73,78 82,95" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 98,95 Q 107,78 116,95" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Rosy Cheeks -->
  <circle cx="60" cy="104" r="5" fill="#f43f5e" opacity="0.6"/>
  <circle cx="120" cy="104" r="5" fill="#f43f5e" opacity="0.6"/>

  <!-- Floating Arms -->
  <ellipse cx="30" cy="120" rx="9" ry="16" transform="rotate(-20 30 120)" fill="url(#bodyGrad)" stroke="#94a3b8" stroke-width="2"/>
  <ellipse cx="150" cy="120" rx="9" ry="16" transform="rotate(20 150 120)" fill="url(#bodyGrad)" stroke="#94a3b8" stroke-width="2"/>

  <!-- Chest Emblem / Ventra Core -->
  <circle cx="90" cy="132" r="6" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
</svg>