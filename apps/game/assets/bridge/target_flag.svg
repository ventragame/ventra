<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 220" width="140" height="220">
  <defs>
    <linearGradient id="flagGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="50%" stop-color="#facc15" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
    <filter id="flagShadow" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Stone Base -->
  <ellipse cx="70" cy="205" rx="35" ry="12" fill="#334155" stroke="#1e293b" stroke-width="3"/>
  <ellipse cx="70" cy="198" rx="24" ry="8" fill="#475569"/>

  <!-- Flagpole -->
  <line x1="70" y1="198" x2="70" y2="20" stroke="#78350f" stroke-width="7" stroke-linecap="round"/>
  <circle cx="70" cy="18" r="8" fill="#facc15" stroke="#a16207" stroke-width="2"/>

  <!-- Fluttering Swallowtail Flag -->
  <path d="M 72,25 Q 105,20 135,32 L 115,55 L 135,78 Q 105,70 72,75 Z" 
        fill="url(#flagGrad)" filter="url(#flagShadow)" stroke="#b45309" stroke-width="2.5"/>

  <!-- Golden Star on Flag -->
  <polygon points="98,40 101,47 109,48 103,53 105,60 98,56 91,60 93,53 87,48 95,47" 
           fill="#ffffff" stroke="#ca8a04" stroke-width="1.5"/>

  <!-- Aura Glow around Golden Finial -->
  <circle cx="70" cy="18" r="22" fill="url(#starGlow)"/>
</svg>