<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="needleNorth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="needleSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="url(#ringGrad)" stroke-width="2.2"/>
  <!-- Tick marks -->
  <line x1="16" y1="4" x2="16" y2="7" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="16" y1="25" x2="16" y2="28" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="4" y1="16" x2="7" y2="16" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="25" y1="16" x2="28" y2="16" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Compass Needle -->
  <!-- North (Cyan) -->
  <polygon points="16,6 19.5,16 16,14.5" fill="url(#needleNorth)"/>
  <polygon points="16,6 12.5,16 16,14.5" fill="#7dd3fc"/>
  <!-- South (Slate) -->
  <polygon points="16,26 19.5,16 16,17.5" fill="url(#needleSouth)"/>
  <polygon points="16,26 12.5,16 16,17.5" fill="#94a3b8"/>
  <!-- Center Pivot -->
  <circle cx="16" cy="16" r="2.5" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
</svg>

