<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="bgLife" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="40%" stop-color="#A855F7" />
      <stop offset="80%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <radialGradient id="warmSun" cx="75%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#F472B6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>
    <filter id="cityGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Modern Twilight / Sunset Sky -->
  <rect width="800" height="600" fill="url(#bgLife)" />
  <circle cx="600" cy="220" r="260" fill="url(#warmSun)" />

  <!-- Modern City Skyline Silhouettes in Background -->
  <g fill="#2E1065" opacity="0.35" transform="translate(0, 180)">
    <rect x="50" y="80" width="60" height="240" rx="3" />
    <rect x="130" y="40" width="80" height="280" rx="3" />
    <polygon points="170,10 160,40 180,40" />
    <rect x="230" y="110" width="70" height="210" rx="3" />
    <rect x="320" y="60" width="90" height="260" rx="3" />
    <rect x="430" y="90" width="75" height="230" rx="3" />
    <rect x="530" y="30" width="100" height="290" rx="3" />
    <polygon points="580,-5 570,30 590,30" />
    <rect x="650" y="100" width="85" height="220" rx="3" />
  </g>

  <!-- Window Glows on Skyline -->
  <g fill="#FEF08A" opacity="0.4" filter="url(#cityGlow)">
    <circle cx="170" cy="260" r="12" />
    <circle cx="360" cy="280" r="10" />
    <circle cx="580" cy="250" r="15" />
  </g>

  <!-- Center Placeholder Focus / Teen & Young Adult Silhouette -->
  <g transform="translate(400, 270)">
    <circle cx="0" cy="-20" r="75" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6 6" />

    <!-- Modern Student / Young Adult with Bun & Laptop -->
    <!-- Head & Hair Bun -->
    <circle cx="0" cy="-55" r="16" fill="#FDE047" fill-opacity="0.9" />
    <circle cx="0" cy="-30" r="26" fill="#FFFFFF" fill-opacity="0.9" />
    <ellipse cx="0" cy="-24" rx="20" ry="14" fill="#F472B6" fill-opacity="0.8" />

    <!-- Shoulders & Outfit -->
    <path d="M-45 30 C -45 -10, 45 -10, 45 30 Z" fill="#FFFFFF" fill-opacity="0.9" />

    <!-- Laptop Icon -->
    <g transform="translate(0, 15)">
      <polygon points="-25,12 25,12 30,16 -30,16" fill="#CBD5E1" />
      <polygon points="-22,-5 22,-5 24,12 -24,12" fill="#E2E8F0" />
      <circle cx="0" cy="3" r="3" fill="#A855F7" />
    </g>

    <!-- Label Pill -->
    <g transform="translate(0, 75)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1E1B4B" fill-opacity="0.75" stroke="#FFFFFF" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">
        VENTRA LIFE (13+ YAŞ)
      </text>
    </g>
  </g>
</svg>

