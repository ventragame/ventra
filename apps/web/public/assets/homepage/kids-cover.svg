<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="bgSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#FDE047" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mountain" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.05" />
    </linearGradient>
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="600" fill="url(#bgSky)" />
  <circle cx="560" cy="180" r="240" fill="url(#sunGlow)" />

  <!-- Soft Dreamy Floating Clouds & Fantasy Castle Silhouettes -->
  <path d="M-50 480 Q 120 380, 280 430 T 560 390 T 850 450 L 850 650 L -50 650 Z" fill="#6EE7B7" fill-opacity="0.35" />
  <path d="M-20 520 Q 200 450, 420 490 T 820 480 L 820 650 L -20 650 Z" fill="#34D399" fill-opacity="0.5" />

  <!-- Floating Islands / Castle Silhouettes in Background -->
  <g opacity="0.4" transform="translate(60, 160) scale(0.7)">
    <rect x="50" y="80" width="40" height="100" rx="4" fill="#FFFFFF" />
    <polygon points="40,80 70,20 100,80" fill="#3B82F6" />
    <rect x="110" y="50" width="60" height="130" rx="6" fill="#FFFFFF" />
    <polygon points="100,50 140,-10 180,50" fill="#2563EB" />
    <rect x="190" y="90" width="35" height="90" rx="4" fill="#FFFFFF" />
    <polygon points="180,90 207.5,40 235,90" fill="#3B82F6" />
  </g>

  <!-- Fluffy Foreground Clouds -->
  <g fill="#FFFFFF" opacity="0.85" filter="url(#softBlur)">
    <circle cx="160" cy="220" r="70" />
    <circle cx="230" cy="200" r="90" />
    <circle cx="310" cy="230" r="70" />
  </g>
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="680" cy="260" rx="110" ry="60" />
    <ellipse cx="630" cy="270" rx="70" ry="50" />
  </g>

  <!-- Center Placeholder Badge / Character Focus Guide -->
  <g transform="translate(400, 270)">
    <!-- Avatar / Explorer Representation -->
    <circle cx="0" cy="-20" r="75" fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6 6" />
    
    <!-- Kids Boy & Dog Silhouette Iconography -->
    <circle cx="-25" cy="-25" r="28" fill="#FFFFFF" fill-opacity="0.9" />
    <path d="M-60 25 C -60 -10, 10 -10, 10 25 Z" fill="#FFFFFF" fill-opacity="0.9" />
    
    <!-- Puppy companion silhouette -->
    <circle cx="35" cy="-5" r="18" fill="#FDE047" fill-opacity="0.95" />
    <ellipse cx="23" cy="-12" rx="5" ry="10" fill="#D97706" />
    <ellipse cx="47" cy="-12" rx="5" ry="10" fill="#D97706" />
    <path d="M15 30 C 15 10, 55 10, 55 30 Z" fill="#FDE047" fill-opacity="0.95" />

    <!-- Explorer Hat / Details -->
    <path d="M-45 -45 Q -25 -65 -5 -45 Z" fill="#2563EB" />
    <ellipse cx="-25" cy="-45" rx="30" ry="6" fill="#1D4ED8" />

    <!-- Label Pill -->
    <g transform="translate(0, 75)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#0F172A" fill-opacity="0.6" stroke="#FFFFFF" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">
        VENTRA KIDS (7–12 YAŞ)
      </text>
    </g>
  </g>
</svg>

