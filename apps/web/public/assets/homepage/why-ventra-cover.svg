<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <defs>
    <linearGradient id="whyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#DDD6FE" />
    </linearGradient>
    <radialGradient id="sunSoft" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="600" height="450" fill="url(#whyBg)" rx="24" />
  <circle cx="180" cy="140" r="140" fill="url(#sunSoft)" />

  <!-- Hills / Adventure ground -->
  <path d="M0 340 Q 150 290 300 320 T 600 300 L 600 450 L 0 450 Z" fill="#86EFAC" fill-opacity="0.6" />
  <path d="M0 370 Q 200 330 400 360 T 600 350 L 600 450 L 0 450 Z" fill="#4ADE80" fill-opacity="0.7" />

  <!-- Silhouettes of 3 Explorer Friends: Boy with glasses, Puppy, Girl with Pigtails -->
  <g transform="translate(300, 260)">
    <!-- Boy with glasses (left) -->
    <circle cx="-80" cy="-40" r="28" fill="#FFFFFF" />
    <path d="M-115 35 C -115 -10, -45 -10, -45 35 Z" fill="#2563EB" />
    <!-- Glasses -->
    <circle cx="-88" cy="-38" r="9" fill="none" stroke="#0F172A" stroke-width="2.5" />
    <circle cx="-72" cy="-38" r="9" fill="none" stroke="#0F172A" stroke-width="2.5" />
    <line x1="-79" y1="-38" x2="-71" y2="-38" stroke="#0F172A" stroke-width="2" />

    <!-- Puppy Companion (center) -->
    <circle cx="0" cy="-10" r="22" fill="#FDE047" />
    <ellipse cx="-16" cy="-18" rx="6" ry="12" fill="#D97706" />
    <ellipse cx="16" cy="-18" rx="6" ry="12" fill="#D97706" />
    <circle cx="-6" cy="-12" r="3" fill="#0F172A" />
    <circle cx="6" cy="-12" r="3" fill="#0F172A" />
    <ellipse cx="0" cy="-5" rx="5" ry="3" fill="#0F172A" />
    <path d="M-20 40 C -20 15, 20 15, 20 40 Z" fill="#FDE047" />

    <!-- Girl with Pigtails (right) -->
    <circle cx="80" cy="-38" r="26" fill="#FFFFFF" />
    <!-- Hair pigtails -->
    <ellipse cx="50" cy="-45" rx="9" ry="14" fill="#EA580C" />
    <ellipse cx="110" cy="-45" rx="9" ry="14" fill="#EA580C" />
    <path d="M45 35 C 45 -8, 115 -8, 115 35 Z" fill="#EC4899" />
  </g>

  <!-- Label badge -->
  <g transform="translate(300, 390)">
    <rect x="-130" y="-16" width="260" height="32" rx="16" fill="#0F172A" fill-opacity="0.65" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">
      VENTRA ÖĞRENME YOLCULUĞU
    </text>
  </g>
</svg>

