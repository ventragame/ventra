<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="160" height="140" fill="none">
  <defs>
    <filter id="bookShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#1E3A8A" flood-opacity="0.18" />
    </filter>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF9C3" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
  </defs>

  <g filter="url(#bookShadow)" transform="rotate(16 80 70)">
    <!-- Book Back Cover -->
    <path d="M15 85 Q 80 100 145 85 L 140 100 Q 80 115 10 100 Z" fill="url(#coverGrad)" />
    
    <!-- Open Book Pages Left -->
    <path d="M18 80 C 45 65, 75 75, 80 82 L 80 40 C 75 32, 45 22, 18 36 Z" fill="url(#pageGrad)" />
    <!-- Page text lines left -->
    <line x1="28" y1="46" x2="68" y2="40" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <line x1="28" y1="56" x2="65" y2="50" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <line x1="28" y1="66" x2="60" y2="60" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

    <!-- Open Book Pages Right -->
    <path d="M80 82 C 85 75, 115 65, 142 80 L 142 36 C 115 22, 85 32, 80 40 Z" fill="#FFFFFF" />
    <!-- Page text lines right -->
    <line x1="92" y1="40" x2="132" y2="46" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <line x1="95" y1="50" x2="132" y2="56" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <line x1="100" y1="60" x2="132" y2="66" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

    <!-- Spine / Center seam -->
    <path d="M78 40 L 78 83 Q 80 85 82 83 L 82 40 Z" fill="#F97316" />
    <!-- Golden bookmark ribbon -->
    <path d="M80 82 Q 85 105 78 115 L 83 118 L 88 115 Q 83 105 82 82 Z" fill="#EAB308" />
  </g>
</svg>

