<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="160" height="140" fill="none">
  <defs>
    <filter id="padShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.25" />
    </filter>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="padGrip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
  </defs>

  <g filter="url(#padShadow)" transform="rotate(8 80 70)">
    <!-- Controller 3D Underbody -->
    <path d="M30 65 C 20 85, 30 115, 52 115 C 65 115, 75 100, 80 92 C 85 100, 95 115, 108 115 C 130 115, 140 85, 130 65 C 122 45, 95 42, 80 44 C 65 42, 38 45, 30 65 Z" fill="url(#padGrip)" />
    
    <!-- Controller Main Body -->
    <path d="M30 60 C 20 80, 32 110, 52 110 C 65 110, 75 95, 80 88 C 85 95, 95 110, 108 110 C 128 110, 140 80, 130 60 C 122 40, 95 38, 80 40 C 65 38, 38 40, 30 60 Z" fill="url(#padGrad)" />
    
    <!-- Gloss Highlight -->
    <ellipse cx="80" cy="46" rx="35" ry="5" fill="#FFFFFF" opacity="0.3" />

    <!-- D-Pad Left -->
    <g transform="translate(48, 65)">
      <rect x="-4" y="-12" width="8" height="24" rx="2" fill="#FFFFFF" opacity="0.9" />
      <rect x="-12" y="-4" width="24" height="8" rx="2" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- ABXY Buttons Right -->
    <g transform="translate(110, 65)">
      <!-- Top (Y - Yellow) -->
      <circle cx="0" cy="-9" r="4.5" fill="#FACC15" stroke="#FFFFFF" stroke-width="1" />
      <!-- Right (B - Red) -->
      <circle cx="9" cy="0" r="4.5" fill="#F87171" stroke="#FFFFFF" stroke-width="1" />
      <!-- Bottom (A - Green) -->
      <circle cx="0" cy="9" r="4.5" fill="#4ADE80" stroke="#FFFFFF" stroke-width="1" />
      <!-- Left (X - Blue) -->
      <circle cx="-9" cy="0" r="4.5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="1" />
    </g>

    <!-- Thumbsticks -->
    <circle cx="65" cy="82" r="7" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.5" />
    <circle cx="95" cy="82" r="7" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.5" />
  </g>
</svg>

