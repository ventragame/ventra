<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </radialGradient>
    <filter id="bloomGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.5" />
    </filter>
  </defs>
  <g filter="url(#bloomGlow)">
    <!-- Stems & Leaves -->
    <path d="M 128 210 Q 115 150 128 100" stroke="#15803d" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M 128 180 Q 80 160 85 130 Q 110 150 128 160" fill="#22c55e" />
    <path d="M 128 160 Q 175 140 170 110 Q 145 130 128 145" fill="#22c55e" />
    <!-- Center Sunflower -->
    <g transform="translate(128, 90)">
      <circle cx="0" cy="0" r="42" fill="#f59e0b" />
      <!-- Petals -->
      <ellipse cx="0" cy="-42" rx="12" ry="22" fill="#facc15" />
      <ellipse cx="30" cy="-30" rx="12" ry="22" transform="rotate(45 30 -30)" fill="#facc15" />
      <ellipse cx="42" cy="0" rx="12" ry="22" transform="rotate(90 42 0)" fill="#facc15" />
      <ellipse cx="30" cy="30" rx="12" ry="22" transform="rotate(135 30 30)" fill="#facc15" />
      <ellipse cx="0" cy="42" rx="12" ry="22" fill="#facc15" />
      <ellipse cx="-30" cy="30" rx="12" ry="22" transform="rotate(225 -30 30)" fill="#facc15" />
      <ellipse cx="-42" cy="0" rx="12" ry="22" transform="rotate(270 -42 0)" fill="#facc15" />
      <ellipse cx="-30" cy="-30" rx="12" ry="22" transform="rotate(315 -30 -30)" fill="#facc15" />
      <!-- Center disc -->
      <circle cx="0" cy="0" r="26" fill="#78350f" />
      <circle cx="0" cy="0" r="22" fill="#92400e" />
      <!-- Happy Face -->
      <circle cx="-8" cy="-5" r="3.5" fill="#fef3c7" />
      <circle cx="8" cy="-5" r="3.5" fill="#fef3c7" />
      <path d="M -7 6 Q 0 14 7 6" stroke="#fef3c7" stroke-width="2.5" fill="none" stroke-linecap="round" />
    </g>
    <!-- Magical Sparkles -->
    <polygon points="50,60 55,75 70,80 55,85 50,100 45,85 30,80 45,75" fill="#38bdf8" />
    <polygon points="200,80 204,92 216,96 204,100 200,112 196,100 184,96 196,92" fill="#f43f5e" />
    <polygon points="175,180 178,188 186,191 178,194 175,202 172,194 164,191 172,188" fill="#a855f7" />
  </g>
</svg>