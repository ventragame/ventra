<!DOCTYPE html>
<html lang="tr">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>Ventra — Macera Evreni</title>
		<style>
			*, *::before, *::after {
				box-sizing: border-box;
			}

			html, body, #canvas {
				margin: 0;
				padding: 0;
				border: 0;
				width: 100%;
				height: 100%;
			}

			body {
				color: #f8fafc;
				background-color: #050914;
				overflow: hidden;
				touch-action: none;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
			}

			#canvas {
				display: block;
				width: 100%;
				height: 100%;
			}

			#canvas:focus {
				outline: none;
			}

			/* Ventra Branded Loading Splash Screen */
			#status {
				position: fixed;
				inset: 0;
				background: radial-gradient(circle at center, #0a1329 0%, #050914 100%);
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				z-index: 100;
				transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
			}

			.ventra-brand {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 14px;
				margin-bottom: 28px;
			}

			.compass-container {
				position: relative;
				width: 76px;
				height: 76px;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.compass-halo {
				position: absolute;
				inset: -8px;
				border-radius: 50%;
				background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, rgba(56, 189, 248, 0) 70%);
				animation: pulseGlow 2.4s ease-in-out infinite;
			}

			@keyframes pulseGlow {
				0%, 100% { transform: scale(0.95); opacity: 0.5; }
				50% { transform: scale(1.15); opacity: 1; }
			}

			.compass-svg {
				width: 72px;
				height: 72px;
				filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.5));
			}

			.brand-title {
				font-size: 26px;
				font-weight: 800;
				letter-spacing: 2px;
				background: linear-gradient(90deg, #38bdf8, #818cf8);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				margin: 0;
			}

			.brand-subtitle {
				font-size: 13px;
				font-weight: 600;
				letter-spacing: 1.5px;
				color: #94a3b8;
				margin: 0;
				text-transform: uppercase;
			}

			/* Loading Progress Container */
			.progress-box {
				width: 280px;
				max-width: 85vw;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 10px;
			}

			.progress-track {
				width: 100%;
				height: 8px;
				background: rgba(15, 23, 42, 0.8);
				border: 1px solid rgba(56, 189, 248, 0.3);
				border-radius: 9999px;
				overflow: hidden;
				box-shadow: 0 0 14px rgba(56, 189, 248, 0.2);
			}

			.progress-bar {
				height: 100%;
				width: 0%;
				background: linear-gradient(90deg, #0284c7 0%, #38bdf8 50%, #818cf8 100%);
				border-radius: 9999px;
				transition: width 0.15s ease-out;
				box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
			}

			.progress-text {
				font-size: 12px;
				font-weight: 600;
				color: #38bdf8;
				letter-spacing: 0.5px;
			}

			/* Failure / Error Notice Card */
			#status-notice {
				display: none;
				max-width: 440px;
				width: 90vw;
				background: #0d1527;
				border: 1.5px solid #ef4444;
				border-radius: 16px;
				padding: 20px;
				color: #f1f5f9;
				text-align: center;
				box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.7);
				z-index: 10;
			}

			#status-notice h3 {
				margin: 0 0 8px 0;
				color: #f87171;
				font-size: 17px;
				font-weight: 700;
			}

			#status-notice p {
				margin: 0 0 16px 0;
				font-size: 13px;
				color: #94a3b8;
				line-height: 1.4;
			}

			.retry-btn {
				background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
				color: #ffffff;
				border: none;
				border-radius: 8px;
				padding: 8px 18px;
				font-size: 13px;
				font-weight: 600;
				cursor: pointer;
			}
		</style>
		
	</head>
	<body>
		<canvas id="canvas">
			Tarayıcınız canvas desteği sağlamıyor.
		</canvas>

		<noscript>
			Tarayıcınızda JavaScript etkinleştirilmelidir.
		</noscript>

		<div id="status">
			<div class="ventra-brand">
				<div class="compass-container">
					<div class="compass-halo"></div>
					<svg class="compass-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
						<defs>
							<linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
								<stop offset="0%" stop-color="#38bdf8" />
								<stop offset="100%" stop-color="#818cf8" />
							</linearGradient>
							<linearGradient id="needleNorth" x1="0%" y1="0%" x2="100%" y2="100%">
								<stop offset="0%" stop-color="#38bdf8" />
								<stop offset="100%" stop-color="#0284c7" />
							</linearGradient>
						</defs>
						<circle cx="16" cy="16" r="13" fill="none" stroke="url(#ringGrad)" stroke-width="2.2"/>
						<line x1="16" y1="4" x2="16" y2="7" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
						<line x1="16" y1="25" x2="16" y2="28" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round"/>
						<line x1="4" y1="16" x2="7" y2="16" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
						<line x1="25" y1="16" x2="28" y2="16" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round"/>
						<polygon points="16,6 19.5,16 16,14.5" fill="url(#needleNorth)"/>
						<polygon points="16,6 12.5,16 16,14.5" fill="#7dd3fc"/>
						<polygon points="16,26 19.5,16 16,17.5" fill="#64748b"/>
						<polygon points="16,26 12.5,16 16,17.5" fill="#94a3b8"/>
						<circle cx="16" cy="16" r="2.5" fill="#f8fafc" stroke="#0284c7" stroke-width="1"/>
					</svg>
				</div>
				<h1 class="brand-title">VENTRA</h1>
				<h2 class="brand-subtitle">Macera Evreni</h2>
			</div>

			<div id="progress-container" class="progress-box">
				<div class="progress-track">
					<div id="progress-bar" class="progress-bar"></div>
				</div>
				<span id="progress-text" class="progress-text">Evren yükleniyor... %0</span>
			</div>

			<div id="status-notice">
				<h3 id="notice-title">Yükleme Hatası</h3>
				<p id="notice-body">Oyun motoru başlatılırken bir sorun oluştu.</p>
				<button class="retry-btn" onclick="window.location.reload()">Yeniden Dene</button>
			</div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":6269008,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const progressContainer = document.getElementById('progress-container');
	const progressBar = document.getElementById('progress-bar');
	const progressText = document.getElementById('progress-text');
	const statusNotice = document.getElementById('status-notice');
	const noticeBody = document.getElementById('notice-body');

	let initializing = true;

	function setFailureNotice(text) {
		progressContainer.style.display = 'none';
		statusNotice.style.display = 'block';
		noticeBody.innerText = text;
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		setFailureNotice('Tarayıcınız WebAssembly veya WebGL 2.0 özelliklerini desteklemiyor:\n' + missing.join(', '));
	} else {
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					var pct = Math.min(100, Math.round((current / total) * 100));
					progressBar.style.width = pct + '%';
					progressText.innerText = 'Kaynaklar yükleniyor... %' + pct;
				} else {
					progressText.innerText = 'Evren başlatılıyor...';
				}
			},
		}).then(() => {
			// Yumuşak geçişle açılış ekranını gizle
			statusOverlay.style.opacity = '0';
			statusOverlay.style.visibility = 'hidden';
			setTimeout(() => {
				if (statusOverlay.parentNode) {
					statusOverlay.parentNode.removeChild(statusOverlay);
				}
			}, 600);
		}).catch((err) => {
			console.error('Godot başlatma hatası:', err);
			var msg = (err && err.message) ? err.message : 'WebAssembly motoru başlatılamadı.';
			setFailureNotice(msg);
		});
	}
}());
		</script>
	</body>
</html>
